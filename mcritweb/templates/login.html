{% extends 'base.html' %}
{% block title%}
Login
{% endblock %}
{% block style %}  <link href="{{ url_for('static', filename='signin.css') }}" rel="stylesheet">{% endblock %}
{% block content %}
<div class="d-flex justify-content-center">
    <form class="form-signin" method='POST'>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h1 class="h3 mb-3 text-center mono-font">Please sign in</h1>
        <div class="mb-2">
            <label for="username" class="visually-hidden">Username</label>
            <input type='text' name='username' id="username" class="form-control" placeholder="Enter username" autocomplete="username" spellcheck="false" autocapitalize="off" autocorrect="off" required autofocus>
        </div>
        <div class="mb-3">
            <label for="current-password" class="visually-hidden">Password</label>
            <input type="password" name='inputPassword' id="current-password" class="form-control" placeholder="Password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-lg btn-primary w-100 mb-2" type="submit">Sign in</button>
        {% if g.operation_mode == 'multi' %}
        <div class="text-center">
            <a class="mono-font d-inline-block mt-2 py-1" href="{{ url_for('authentication.register') }}">Click here to register</a>
        </div>
        {% endif %}
      </form>
</div>
{% endblock %}
