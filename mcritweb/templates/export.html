{% extends 'base.html' %}
{% set icons_only_in_the_navbar=true %}
{% block title%}
Export
{% endblock %}
{% block content %}
<h1 class="visually-hidden">Export</h1>
<div class="container my-4" style="max-width: 600px;">
    <form action = "{{ url_for('data.export_view') }}" method='post'>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group mb-3">
            <label for="samples" class="form-label">Enter comma-separated sample IDs to export, or leave blank to export all samples</label>
            <input type="text" name='samples' class="form-control" id="samples" placeholder="Export all samples">
        </div>
        <button type="submit" class="btn btn-primary">Export</button>
    </form>
</div>
{% endblock %}
