{% extends 'base.html' %}
{% block title%}
Register
{% endblock %}
{% block content %}
<div class="d-flex justify-content-center my-4">
  <div style="max-width: 500px; width: 100%;">
  <form method='post'>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h3 class="mb-3">Define User Details:</h3>
    <div class="mb-2">
      <label for="username" class="form-label">Username</label>
      <input name='username' class="form-control" id="username" title="Allowed: ^(?=[a-zA-Z0-9._]{3,20}$)(?!.*[_.]{2})[^_.].*[^_.]$ -- i.e. 3-20 chars, alphanumeric with single dots and underscores in the middle" pattern="^(?=[a-zA-Z0-9._]{3,20}$)(?!.*[_.]{2})[^_.].*[^_.]$" autocomplete="username" spellcheck="false" autocapitalize="off" autocorrect="off" required autofocus>
    </div>
    <div class="mb-2">
      <label for="inputPassword1" class="form-label">Password</label>
      <input type="password" name='inputPassword1' class="form-control" id="inputPassword1" autocomplete="new-password" required>
    </div>
    <div class="mb-3">
        <label for="inputPassword2" class="form-label">Confirm password</label>
        <input type="password" class="form-control" name="inputPassword2" id="inputPassword2" autocomplete="new-password" required>
    </div>
    {% if is_registration_token_required %}
      <div class="mb-3">
        <label for="registrationToken" class="form-label">Registration token</label>
        <input class="form-control" name="registrationToken" id="registrationToken" value="{{ query_token }}" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off" required>
      </div>
    {% endif %}
      {% if g.first_user %}
      <h3 class="mt-4 mb-3">Define Server Details:</h3>
      <div class="mb-3">
        <label for="server" class="form-label">Choose MCRIT backend server:</label>
        <input type="url" name='url' class="form-control" id="server" value="{{ default_mcrit_server }}" required>
      </div>
      <div class="mb-3">
        <label for="mcritServerToken" class="form-label">Enter optional Server Token (sent as AUTH_TOKEN):</label>
        <input type="text" name='mcritServerToken' class="form-control" id="mcritServerToken" value="" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off">
      </div>
      <div class="mb-3">
        <label for="set-registration-token" class="form-label">Optional registration token (replace or clear if other or no token desired):</label>
        <input name='setRegistrationToken' class="form-control" id="set-registration-token" value="{{ proposed_registration_token }}" pattern="^[a-zA-Z0-9._\-]{3,36}$" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off">
      </div>
    <h3 class="mt-4 mb-3">Define Operation Mode:</h3>
    <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="operationMode" id="radio_single" value="single" checked>
        <label class="form-check-label" for="radio_single">
          Single-user
        </label>
    </div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="radio" name="operationMode" id="radio_multi" value="multi">
        <label class="form-check-label" for="radio_multi">
          Multi-user
        </label>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>
  </div>
</div>

{% endblock %}
