# Pinning actions to a commit SHA is what makes them immutable; it also means nothing updates
# them. This is the other half of that decision: a pull request when a pinned action moves.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
