name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6

      # note: unlike mcrit, we do not run `ruff format --check` - this codebase has never
      # been formatted and reflowing it would bury the history of every file
      - name: Install Ruff
        run: python -m pip install --upgrade pip "ruff==0.16.0"

      - name: Lint
        run: ruff check .

  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.13 and 3.14 became reachable when #27 lifted the Flask 2.2.5 pin, which
        # called pkgutil.get_loader - removed in 3.14. Keeping them in the matrix is
        # what stops that regressing quietly.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          # pytest is not a runtime dependency, so it is deliberately not in
          # requirements.txt. It used to arrive with mcrit; mcrit declares it under its
          # `dev` extra now, so it has to be installed here - pinned, like ruff above.
          python -m pip install "pytest==9.1.1" "pytest-cov==7.1.0"

      - name: Run unit tests
        run: python -m pytest
