name: Release

# Pushing a vX.Y.Z tag is the release. Nothing is published to a package index: this repository is
# deployed from a checkout, so the release is the tag, the GitHub release page carrying that
# version's changelog section, and the built artifacts attached to it as a convenience.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check the tag against the declared version and the changelog
        id: guard
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python .github/workflows/scripts/release_guard.py \
            --tag "${TAG}" --notes release-notes.md --github-output "${GITHUB_OUTPUT}"

      - name: Check the tag is on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "${TAG}" origin/master; then
            echo "::error::${TAG} is not an ancestor of master; releases are cut from master."
            exit 1
          fi

      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api \
            "repos/${REPO}/actions/workflows/test.yml/runs?head_sha=${SHA}&status=completed" \
            --jq '.workflow_runs[0].conclusion // ""')
          if [ -z "${conclusion}" ]; then
            echo "::error::No completed CI run for ${SHA}. Wait for master to go green, then re-run."
            exit 1
          fi
          if [ "${conclusion}" != "success" ]; then
            echo "::error::CI concluded '${conclusion}' for ${SHA}. Fix master before releasing."
            exit 1
          fi
          echo "CI passed on ${SHA}"

      - name: Keep the release notes for the later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build and check the artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # MCRITweb is never installed from a wheel, so this is a completeness check rather than a
      # publish step: the templates, static assets and schema have to arrive with the package.
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the built wheel into a clean environment
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/mcritweb-"${VERSION}"-py3-none-any.whl
          /tmp/smoke/bin/python -P - <<'PY'
          import os
          import pathlib

          import mcritweb
          from mcritweb.views.utility import get_mcritweb_version

          installed = pathlib.Path(mcritweb.__file__).parent
          assert "site-packages" in str(installed), f"imported a source tree: {installed}"
          assert get_mcritweb_version() == os.environ["VERSION"], get_mcritweb_version()
          for shipped in ("templates/base.html", "static/css/all.css", "sql/create_table_server.sql"):
              assert (installed / shipped).exists(), f"{shipped} did not ship"
          print(f"mcritweb {os.environ['VERSION']} imported from {installed}")
          PY

      - name: Keep the artifacts for the later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: dist

      - name: Fetch the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # --generate-notes appends its list under --notes-file rather than replacing it, so the
      # changelog section leads and `.github/release.yml` groups what follows. A pre-release
      # is marked as such and never becomes "latest".
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          shopt -s failglob
          flags=(--latest)
          if [ "${PRERELEASE}" = "true" ]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "${TAG}" dist/* \
            --repo "${REPO}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
